	<style>
		/* ---------- Шрифт Manrope ----------
		   Основной источник — Google Fonts (ссылка выше).
		   Локальные файлы ниже — запасной вариант, если Google недоступен. */

		/* cyrillic */
		@font-face {
			font-family: "Manrope Local";
			font-style: normal;
			font-weight: 400 600;
			font-display: swap;
			src: url(./assets/f0e0d381.woff2) format("woff2");
			unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
		}

		/* latin */
		@font-face {
			font-family: "Manrope Local";
			font-style: normal;
			font-weight: 400 600;
			font-display: swap;
			src: url(./assets/732ccd61.woff2) format("woff2");
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}

		/* ---------- Базовые стили ---------- */

		:root {
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		* {
			box-sizing: border-box;
			-webkit-font-smoothing: inherit;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			min-height: 100%;
			background: #F4F2F0;
		}

		body {
			font-family: sans-serif;
			font-size: 12px;
		}

		/*
		 * Тексты: <p>/<h*> задают базовый шрифт (Inter), а вложенный <span> или <a>
		 * — реальный шрифт. Такая пара сохранена намеренно: от неё зависит высота
		 * строки, а значит и положение текста до пикселя.
		 */
		h1,
		h2,
		h3,
		p {
			margin: 0;
			font-family: Inter, sans-serif;
			font-weight: 400;
			color: #000;
		}

		/* ---------- Страница ---------- */

		.stage {
			display: flex;
			justify-content: center;
			align-items: flex-start;
			width: 100%;
			min-height: 100vh;
			overflow-x: hidden;
			background: #F4F2F0;
		}

		.page {
			position: relative;
			width: 390px;
			height: 1366px;
			min-height: 100vh;
			margin: 0 auto;
			overflow: hidden;
			overflow: clip;
			background: #fff;
		}

		.page__bg {
			position: absolute;
			top: 0;
			left: 0;
			width: 390px;
			height: 1437px;
		}

		/* ---------- Верхний блок: имя, описание, кнопки ---------- */

		.intro {
			position: absolute;
			top: 240px;
			left: 0;
			right: 0;
			height: 305px;
		}

		.intro__text {
			position: absolute;
			top: 50px;
			left: 20px;
			width: 350px;
			height: 114px;
		}

		.username {
			position: absolute;
			top: 5px;
			left: 53%;
			transform: translateX(-50%);
			white-space: pre;
			font-size: 32px;
			line-height: 38.4px;
			text-align: center;
		}

		.username span {
			font-family: "Manrope", "Manrope Local", sans-serif;
			font-weight: 600;
			letter-spacing: -1.92px;
			color: #0b0b0b;
		}

		.bio {
			position: absolute;
			top: 53.72px;
			left: 50%;
			transform: translateX(-50%);
			white-space: pre;
			font-size: 18px;
			line-height: 23.4px;
			text-align: center;
		}

		.bio span {
			font-family: "Manrope", "Manrope Local", sans-serif;
			font-weight: 500;
			letter-spacing: -0.3px;
			color: #737373;
		}

		.btn {
			position: absolute;
			left: 21px;
			display: block;
			width: 350px;
			height: 60px;
			overflow: hidden;
			border-radius: 8px;
			text-decoration: none;
		}

		.btn--partner {
			top: 154px;
			background: #e3e3e3;
		}

		.btn--consult {
			top: 226px;
			background: #41b455;
		}

		.btn p {
			position: absolute;
			top: 49%;
			left: 50%;
			transform: translate(-50%, -50%);
			white-space: pre;
			font-size: 16px;
			line-height: 19.2px;
			text-align: center;
		}

		.btn span {
			font-family: "Helvetica Neue";
			font-weight: 500;
			letter-spacing: 0;
		}

		.btn--partner span {
			font-weight: 400;
		}

		.btn--consult span {
			color: #fff;
		}

		/* ---------- Hero-видео, градиент, аватар ---------- */

		.hero-video {
			position: absolute;
			top: -2px;
			left: 0;
			display: block;
			width: 389px;
			height: 242px;
			object-fit: cover;
		}

		.hero-fade {
			position: absolute;
			top: 71px;
			left: 0;
			right: 0;
			height: 169px;
			background: linear-gradient(#fff0 0%, #f4f2f0 100%);
		}

		.avatar {
			position: absolute;
			top: 160px;
			left: 135px;
			width: 120px;
			height: 120px;
			overflow: hidden;
			border-radius: 50%;
		}

		.avatar img {
			display: block;
			width: 100%;
			height: 100%;
		}

		.avatar::after {
			content: "";
			position: absolute;
			inset: 0;
			border: 4px solid #f4f2f0;
			border-radius: 50%;
		}

		.badge {
			position: absolute;
			top: 259px;
			left: 181px;
			display: block;
			width: 30px;
			height: 30px;
		}

		/* ---------- Сеть клиник ---------- */

		.clinics {
			position: absolute;
			top: 558px;
			left: 0;
			width: 390px;
			height: 793px;
		}

		.clinics__head {
			position: absolute;
			top: 20px;
			left: 20px;
			right: 20px;
			height: 14px;
			overflow: hidden;
		}

		.clinics__title {
			position: absolute;
			top: 44%;
			left: 50%;
			transform: translate(-50%, -50%);
			white-space: pre;
			font-size: 12px;
			line-height: 14.4px;
			text-align: center;
		}

		.clinics__title span {
			font-family: "Helvetica Neue";
			letter-spacing: 1.2px;
			color: #606060;
		}

		.locations {
			position: absolute;
			top: 54px;
			left: 25px;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 18px;
			width: 340px;
		}

		/* ---------- Карточка клиники ---------- */

		.card {
			position: relative;
			flex: none;
			width: 100%;
			height: 227px;
			overflow: hidden;
			border-radius: 8px;
			background: #f9f8f6;
		}

		.card::after {
			content: "";
			position: absolute;
			inset: 0;
			border: 0.2px solid #adadad;
			border-radius: inherit;
			pointer-events: none;
		}

		.card__map {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: auto;
			aspect-ratio: 2.19706;
			border-radius: 8px 8px 0 0;
		}

		/* Невидимая ссылка на всю карточку (короткая ссылка 2ГИС) */
		.card__link {
			position: absolute;
			inset: 0;
		}

		.card__info {
			position: absolute;
			top: 155px;
			left: 0;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 10px;
			width: 340px;
			padding: 14px 12px;
			overflow: hidden;
			border-radius: 0 0 8px 8px;
			background: #f9f8f6;
			box-shadow: 0 0.455154px 0.910308px #0000001a;
			pointer-events: none; /* клик по пустому месту уходит на .card__link */
		}

		.card__details {
			position: relative;
			flex: none;
			width: 209px;
			height: 44px;
		}

		.card__name {
			position: absolute;
			top: 0;
			left: 0;
			right: 113px;
			height: 19px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			white-space: pre-wrap;
			word-break: break-word;
			overflow-wrap: break-word;
		}

		.card__name h3 {
			font-size: 16px;
			line-height: 19.2px;
		}

		.card__name span {
			font-family: "Helvetica Neue";
			font-weight: 700;
		}

		.card__address {
			position: absolute;
			top: 25px;
			left: 0;
			width: 209px;
			white-space: pre;
			font-size: 14px;
			line-height: 18.2px;
		}

		.card__address a {
			font-family: "Helvetica Neue";
			color: #606060;
			text-decoration: underline;
			pointer-events: auto;
		}

		/* Dental Plaza Premium — чуть другие размеры текстового блока */
		.card--premium .card__details {
			width: 167px;
			height: 45px;
		}

		.card--premium .card__name {
			right: auto;
			width: 167px;
			height: auto;
			white-space: pre;
			word-break: normal;
			overflow-wrap: normal;
		}

		.card--premium .card__address {
			top: 26px;
			width: 165px;
		}
	</style>
</head>
